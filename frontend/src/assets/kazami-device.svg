<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Kazami のカメラ">
  <defs>
    <!-- 背景：明るいスタジオの床と壁 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eaeb"/>
      <stop offset="0.72" stop-color="#dcdedf"/>
      <stop offset="1" stop-color="#cfd2d3"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.42" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 本体：白い樹脂。左上から光が当たる -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f3f4f4"/>
      <stop offset="1" stop-color="#d9dcdd"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#c9cccd" stop-opacity="0"/>
      <stop offset="1" stop-color="#bfc3c4" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7d8285" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7d8285" stop-opacity="0"/>
    </radialGradient>
    <!-- レンズ：金属の縁、黒いガラス、青い反射 -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.5" stop-color="#c9cdd0"/>
      <stop offset="1" stop-color="#8e9498"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.45" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="0.45" stop-color="#151a22"/>
      <stop offset="1" stop-color="#06080b"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="0.7" stop-color="#1f2c44"/>
      <stop offset="1" stop-color="#3b5379"/>
    </radialGradient>
  </defs>

  <rect width="360" height="200" fill="url(#bg)"/>
  <rect width="360" height="200" fill="url(#spot)"/>

  <!-- 床に落ちる影 -->
  <ellipse cx="186" cy="192" rx="98" ry="10" fill="url(#shadow)"/>

  <!-- 本体（角の丸い四角） -->
  <rect x="86" y="14" width="196" height="182" rx="54" fill="url(#body)"/>
  <rect x="86" y="14" width="196" height="182" rx="54" fill="url(#bodyEdge)"/>
  <rect x="86.5" y="14.5" width="195" height="181" rx="53.5" fill="none" stroke="#c7cacb" stroke-opacity="0.7"/>
  <!-- 上面の照り -->
  <path d="M120 22 Q184 12 248 22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- レンズ -->
  <circle cx="134" cy="70" r="33" fill="#e6e8e9"/>
  <circle cx="134" cy="70" r="30" fill="url(#ring)"/>
  <circle cx="134" cy="70" r="24" fill="#2b2f33"/>
  <circle cx="134" cy="70" r="21.5" fill="url(#glass)"/>
  <circle cx="134" cy="70" r="11" fill="url(#iris)"/>
  <circle cx="134" cy="70" r="4.5" fill="#05070a"/>
  <!-- ガラスの反射 -->
  <ellipse cx="126" cy="61" rx="6" ry="3.6" fill="#ffffff" opacity="0.55" transform="rotate(-35 126 61)"/>
  <circle cx="141" cy="77" r="1.6" fill="#8fb4ff" opacity="0.6"/>

  <!-- センサーの小窓 -->
  <circle cx="205" cy="66" r="5.5" fill="#d3d6d7"/>
  <circle cx="205" cy="66" r="4" fill="#111418"/>
  <circle cx="203.8" cy="64.8" r="1" fill="#ffffff" opacity="0.6"/>
</svg>
