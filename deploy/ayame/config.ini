# Ayame の設定（docker compose で kazayomi と一緒に動かすとき）。項目は ayame の config_example.ini を参照。
log_dir = /tmp
log_stdout = true
debug = false
listen_ipv4_address = 0.0.0.0
listen_port_number = 3000

# register のたびに kazayomi に入ってよいかを聞く。これで、ルームIDを知っているだけでは入れない。
# Ayame は kazayomi と同じネットワーク名前空間で動くので、127.0.0.1 で呼ぶ（kazayomi は 127.0.0.1 からの呼び出しにだけ答える）。
# kazayomi の AYAME_WEBHOOK_SECRET を設定したときは、末尾に ?key=<その値> を付ける。
authn_webhook_url = http://127.0.0.1:8080/api/ayame/authn
webhook_request_timeout_sec = 5
