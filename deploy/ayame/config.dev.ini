# Ayame の設定（開発用。kazayomi をコンテナの外（uv run）で動かすとき）。項目は ayame の config_example.ini を参照。
log_dir = /tmp
log_stdout = true
debug = false
listen_ipv4_address = 0.0.0.0
listen_port_number = 3000

# register のたびに kazayomi に入ってよいかを聞く。これで、ルームIDを知っているだけでは入れない。
# Docker Desktop（Mac）では、host.docker.internal 経由の呼び出しは kazayomi から 127.0.0.1 に見える。
# Linux の Docker では 172.17.0.1 などに見えるので、backend/.env に AYAME_WEBHOOK_ALLOWED_IPS=172.16.0.0/12 を足す。
# kazayomi の AYAME_WEBHOOK_SECRET を設定したときは、末尾に ?key=<その値> を付ける。
authn_webhook_url = http://host.docker.internal:8080/api/ayame/authn
webhook_request_timeout_sec = 5
